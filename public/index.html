<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Vector AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; background-color: #ffffff; color: #0d0d0d; overflow: hidden; display: flex; flex-direction: column; }

        .top-nav { height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #f0f0f0; z-index: 10; }
        .nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; background: #fff; display: flex; align-items: center; justify-content: center; color: #0d0d0d; cursor: pointer; }
        .plus-pill { background: #e8f0fe; color: #1a73e8; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; border: none; }

        .main-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 16px; }
        
        .hologram-container { width: 100%; height: 160px; background: #030814; border-radius: 16px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #00f0ff; margin-bottom: 12px; }
        canvas#holoCanvas { width: 100%; height: 100%; display: block; }

        .chip-list { display: flex; flex-direction: column; gap: 10px; margin-top: auto; margin-bottom: 12px; }
        .chip-item { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #202124; padding: 10px; border-radius: 12px; cursor: pointer; background: #f8f9fa; border: 1px solid #e9ecef; }
        .chip-icon { font-size: 16px; color: #1a73e8; width: 24px; text-align: center; }

        .chat-output { flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.6; color: #1f1f1f; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .chat-card { padding: 12px 16px; border-radius: 16px; background: #f8f9fa; border: 1px solid #e9ecef; white-space: pre-wrap; word-break: break-word; }
        .media-result { width: 100%; max-height: 280px; border-radius: 12px; border: 1px solid #e5e5e5; object-fit: cover; margin-top: 8px; }

        .input-bar-container { padding: 10px 16px 16px 16px; background: #ffffff; border-top: 1px solid #f0f0f0; }
        .input-pill { background: #f4f4f4; border-radius: 28px; display: flex; align-items: center; padding: 4px 8px 4px 14px; gap: 6px; border: 1px solid #e5e5e5; }
        .input-pill input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: #0d0d0d; }
        .action-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #444746; font-size: 15px; cursor: pointer; }
        .send-btn { background: #1a73e8; color: #ffffff; }

        .creator-info { text-align: center; font-size: 10px; color: #80868b; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-btn" onclick="clearChat()"><i class="fa-solid fa-plus"></i></button>
        <button class="plus-pill"><i class="fa-solid fa-sparkles"></i> Nano Vector AI</button>
        <button class="nav-btn" onclick="triggerSearch()"><i class="fa-solid fa-globe"></i></button>
    </div>

    <div class="main-container">
        <div class="hologram-container">
            <canvas id="holoCanvas"></canvas>
        </div>

        <div class="chat-output" id="chatOutput">
            <div class="chat-card">Hello! I am Nano Vector AI, created by David Kamsi Elvis by Vector's Element Tech. Ask me anything, search the web, generate images, or create videos.</div>
        </div>

        <div class="chip-list" id="chipList">
            <div class="chip-item" onclick="triggerSearch()">
                <div class="chip-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div>Search the Web (DuckDuckGo Live)</div>
            </div>
            <div class="chip-item" onclick="triggerImageGen()">
                <div class="chip-icon"><i class="fa-solid fa-image"></i></div>
                <div>Create an Image or Sticker</div>
            </div>
            <div class="chip-item" onclick="triggerVideoGen()">
                <div class="chip-icon"><i class="fa-solid fa-video"></i></div>
                <div>Generate AI Video Frame Motion</div>
            </div>
        </div>
    </div>

    <div class="input-bar-container">
        <div class="input-pill">
            <input type="text" id="userInput" placeholder="Ask Nano Vector..." onkeypress="handleKeyPress(event)">
            <button class="action-icon" onclick="startSpeech()"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-icon send-btn" onclick="sendPrompt('text')"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
        <div class="creator-info">Created by David Kamsi Elvis by Vector's Element Tech</div>
    </div>

    <script>
        // Hologram Animation Engine
        const canvas = document.getElementById('holoCanvas');
        const ctx = canvas.getContext('2d');
        let isSpeaking = false;

        function resizeHolo() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.addEventListener('resize', resizeHolo);
        resizeHolo();

        function renderHologram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy - 5, 45, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(cx - 16, cy - 12, 4, 0, Math.PI * 2);
            ctx.arc(cx + 16, cy - 12, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            let mouthH = isSpeaking ? (Math.abs(Math.sin(Date.now() / 90)) * 10 + 2) : 2;
            ctx.ellipse(cx, cy + 18, 12, mouthH, 0, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(renderHologram);
        }
        renderHologram();

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.onstart = () => { isSpeaking = true; };
                utter.onend = () => { isSpeaking = false; };
                utter.onerror = () => { isSpeaking = false; };
                window.speechSynthesis.speak(utter);
            }
        }

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Speech recognition not supported on this device.");
            const rec = new SpeechRecognition();
            rec.onstart = () => { document.getElementById('userInput').placeholder = "Listening..."; };
            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendPrompt('text');
            };
            rec.start();
        }

        function triggerSearch() {
            const input = document.getElementById('userInput');
            if (!input.value) input.value = "Search latest tech news";
            sendPrompt('search');
        }
        function triggerImageGen() {
            const input = document.getElementById('userInput');
            if (!input.value) input.value = "Futuristic Nano Vector AI Hologram Avatar";
            sendPrompt('image');
        }
        function triggerVideoGen() {
            const input = document.getElementById('userInput');
            if (!input.value) input.value = "Futuristic Cyber AI Core Motion Video";
            sendPrompt('video');
        }

        function clearChat() {
            document.getElementById('chatOutput').innerHTML = '<div class="chat-card">New session initialized. Ask Nano Vector anything!</div>';
        }
        function handleKeyPress(e) { if (e.key === 'Enter') sendPrompt('text'); }

        async function sendPrompt(mode = 'text') {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const chatOutput = document.getElementById('chatOutput');
            document.getElementById('chipList').style.display = 'none';

            const userCard = document.createElement('div');
            userCard.className = 'chat-card';
            userCard.style.background = '#e8f0fe';
            userCard.innerText = prompt;
            chatOutput.appendChild(userCard);

            input.value = '';
            isSpeaking = true;

            const aiCard = document.createElement('div');
            aiCard.className = 'chat-card';
            aiCard.innerText = mode === 'search' ? "Searching DuckDuckGo..." : "Nano Vector is processing...";
            chatOutput.appendChild(aiCard);
            chatOutput.scrollTop = chatOutput.scrollHeight;

            try {
                const res = await fetch('/api/nano-vector', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode, prompt })
                });
                const data = await res.json();

                if (data.isImage || data.isVideo) {
                    aiCard.innerHTML = `<p>${data.isImage ? 'Generated Image:' : 'Generated Video Frame:'}</p><img src="${data.result}" class="media-result">`;
                    isSpeaking = false;
                } else if (data.success) {
                    aiCard.innerText = data.result;
                    speak(data.result);
                } else {
                    aiCard.innerText = "Error: " + data.error;
                    isSpeaking = false;
                }
            } catch (err) {
                aiCard.innerText = "Connection Error: " + err.message;
                isSpeaking = false;
            }
            chatOutput.scrollTop = chatOutput.scrollHeight;
        }
    </script>
</body>
</html>
