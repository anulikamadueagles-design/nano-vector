<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Vector AI Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #030814; color: #c5c6c7; }
        body { display: flex; flex-direction: column; }

        .top-bar { height: 48px; background: #081026; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #00f0ff; z-index: 20; }
        .logo { font-size: 16px; font-weight: bold; color: #00f0ff; text-transform: uppercase; letter-spacing: 1px; }
        .creator-tag { font-size: 10px; color: #45a29e; }

        /* Custom Hologram Display Container */
        #hologram-viewport { height: 260px; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; position: relative; border-bottom: 1px solid #081026; overflow: hidden; }
        .hologram-img { height: 100%; width: auto; object-fit: contain; filter: drop-shadow(0 0 12px #00f0ff); transition: transform 0.2s ease; }
        .hologram-img.speaking { animation: pulse 0.6s infinite alternate; }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 12px #00f0ff); }
            100% { transform: scale(1.02); filter: drop-shadow(0 0 22px #00f0ff); }
        }

        /* Workspace Output Area */
        .workspace { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: rgba(8, 16, 38, 0.85); border: 1px solid #00f0ff; border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; box-shadow: 0 0 10px rgba(0,240,255,0.15); }

        /* Media Displays */
        .generated-media { width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid #00f0ff; margin-top: 8px; object-fit: cover; }

        /* Controls Area */
        .controls { background: #081026; padding: 10px; border-top: 1px solid #00f0ff; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 8px; }
        select, input[type="text"] { background: #030814; border: 1px solid #00f0ff; color: #00f0ff; padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
        select { flex: 1; }
        input[type="text"] { flex: 1; color: #fff; }

        .btn { background: #00f0ff; color: #030814; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; justify-content: center; }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; padding: 0; }
        .btn-outline { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <div class="logo"><i class="fa-solid fa-shield-halved"></i> Vector AI Engine</div>
            <div class="creator-tag">Created by David Kamsi Elvis (Vectors Element Tech)</div>
        </div>
    </div>

    <!-- Live Hologram Display -->
    <div id="hologram-viewport">
        <img id="vectorHologram" class="hologram-img" src="hologram.png" alt="Vector Hologram Assistant">
    </div>

    <div class="workspace" id="workspace">
        <div class="card" id="outputBox">Hello, I'm Vector. Your AI security assistant created by David Kamsi Elvis by Vectors Element Tech. I help you stay safe, scan your network, generate images and videos, and keep your digital world secure.</div>
    </div>

    <div class="controls">
        <div class="row">
            <select id="categorySelect">
                <option value="1. Security & Core AI">1. Security & Core AI</option>
                <option value="2. Media Generation">2. Media Generation</option>
            </select>
            <select id="featureSelect">
                <option value="General AI Chat Engine">General AI Chat Engine</option>
                <option value="AI Image Generator">AI Image Generator</option>
                <option value="AI Video Generator">AI Video Generator</option>
            </select>
        </div>
        <div class="row">
            <input type="text" id="promptInput" placeholder="Enter request or talk to Vector...">
            <button class="btn btn-icon btn-outline" onclick="startSpeech()"><i class="fa-solid fa-microphone"></i></button>
            <button class="btn btn-icon" onclick="runEngine()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const holoImg = document.getElementById('vectorHologram');

        // Text-To-Speech Synthesis
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.onstart = () => { holoImg.classList.add('speaking'); };
                utterance.onend = () => { holoImg.classList.remove('speaking'); };
                utterance.onerror = () => { holoImg.classList.remove('speaking'); };
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech-To-Text Input
        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.onstart = () => { document.getElementById('promptInput').placeholder = "Listening..."; };
            recognition.onresult = (event) => {
                document.getElementById('promptInput').value = event.results[0][0].transcript;
                runEngine();
            };
            recognition.start();
        }

        // Send API Request
        async function runEngine() {
            const category = document.getElementById('categorySelect').value;
            const feature = document.getElementById('featureSelect').value;
            const prompt = document.getElementById('promptInput').value;
            const outputBox = document.getElementById('outputBox');

            outputBox.innerText = "Vector processing request...";
            holoImg.classList.add('speaking');

            try {
                const res = await fetch('/api/nano-vector', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, feature, prompt })
                });
                const data = await res.json();
                
                if (data.isImage) {
                    outputBox.innerHTML = `<p style="margin-bottom:6px;">Generated Image Preview:</p><img src="${data.result}" class="generated-media">`;
                    holoImg.classList.remove('speaking');
                } else if (data.isVideo) {
                    outputBox.innerHTML = `<p style="margin-bottom:6px;">Generated Video Frame Matrix:</p><img src="${data.result}" class="generated-media">`;
                    holoImg.classList.remove('speaking');
                } else if (data.success) {
                    outputBox.innerText = data.result;
                    speakText(data.result);
                } else {
                    outputBox.innerText = "Error: " + data.error;
                    holoImg.classList.remove('speaking');
                }
            } catch (err) {
                outputBox.innerText = "Connection Error: " + err.message;
                holoImg.classList.remove('speaking');
            }
        }
    </script>
</body>
</html>
