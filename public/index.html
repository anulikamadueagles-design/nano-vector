<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Vector AI Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #0b0c10; color: #c5c6c7; }
        body { display: flex; flex-direction: column; }

        .top-bar { height: 48px; background: #1f2833; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #45a29e; z-index: 20; }
        .logo { font-size: 16px; font-weight: bold; color: #66fcf1; }
        .creator-tag { font-size: 10px; color: #45a29e; }

        /* Hologram Canvas View */
        #hologram-viewport { height: 180px; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; position: relative; border-bottom: 1px solid #1f2833; }
        canvas#hologramCanvas { width: 100%; height: 100%; display: block; }

        /* Content Workspace */
        .workspace { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        /* Interactive Drawing Section */
        #drawingArea { display: none; background: #0b0c10; border: 1px solid #45a29e; border-radius: 8px; padding: 8px; text-align: center; }
        #paintCanvas { background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }

        /* Controls Area */
        .controls { background: #1f2833; padding: 10px; border-top: 1px solid #45a29e; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 8px; }
        select, input[type="text"] { background: #0b0c10; border: 1px solid #45a29e; color: #66fcf1; padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
        select { flex: 1; }
        input[type="text"] { flex: 1; color: #fff; }

        .btn { background: #66fcf1; color: #0b0c10; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; justify-content: center; }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; padding: 0; }
        .btn-outline { background: transparent; border: 1px solid #66fcf1; color: #66fcf1; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <div class="logo">Nano Vector AI</div>
            <div class="creator-tag">By David Kamsi Elvis (Vectors Element Tech)</div>
        </div>
        <button class="btn btn-outline" style="font-size:11px;" onclick="toggleDrawing()">
            <i class="fa-solid fa-paintbrush"></i> Drawing
        </button>
    </div>

    <!-- AI Hologram Face Canvas -->
    <div id="hologram-viewport">
        <canvas id="hologramCanvas"></canvas>
    </div>

    <!-- Interactive Canvas Drawing Tool -->
    <div id="drawingArea">
        <canvas id="paintCanvas" width="300" height="150"></canvas>
        <div style="margin-top:6px; display:flex; justify-content:center; gap:8px;">
            <button class="btn btn-outline" style="font-size:11px;" onclick="clearCanvas()">Clear</button>
            <button class="btn" style="font-size:11px;" onclick="sendDrawing()">Analyze Drawing</button>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="card" id="outputBox">Hello! I am Nano Vector AI, created by David Kamsi Elvis by Vectors Element Tech. How can I assist you today?</div>
    </div>

    <div class="controls">
        <div class="row">
            <select id="categorySelect" onchange="updateFeatures()">
                <option value="General AI Core">1. General AI Core</option>
                <option value="Software & Code">2. Software & Code</option>
                <option value="Image & Media">3. Image & Media</option>
            </select>
            <select id="featureSelect">
                <option value="General AI Chat Engine">General AI Chat Engine</option>
                <option value="AI Image Generator">AI Image Generator</option>
                <option value="Drawing Canvas AI">Drawing Canvas AI</option>
            </select>
        </div>
        <div class="row">
            <input type="text" id="promptInput" placeholder="Ask anything or talk to AI...">
            <button class="btn btn-icon btn-outline" onclick="startSpeechRecognition()"><i class="fa-solid fa-microphone"></i></button>
            <button class="btn btn-icon" onclick="runEngine()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // --- Animated Hologram Canvas System ---
        const canvas = document.getElementById('hologramCanvas');
        const ctx = canvas.getContext('2d');
        let isTalking = false;
        let mouthOpen = 0;

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawHologram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Hologram Outer Glow Circle
            ctx.strokeStyle = '#66fcf1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Eyes (Blinking/Moving)
            const eyeOffset = Math.sin(Date.now() / 300) * 2;
            ctx.fillStyle = '#66fcf1';
            ctx.beginPath();
            ctx.arc(cx - 20, cy - 15 + eyeOffset, 6, 0, Math.PI * 2); // Left Eye
            ctx.arc(cx + 20, cy - 15 + eyeOffset, 6, 0, Math.PI * 2); // Right Eye
            ctx.fill();

            // Nose
            ctx.strokeStyle = '#45a29e';
            ctx.beginPath();
            ctx.moveTo(cx, cy - 5);
            ctx.lineTo(cx - 5, cy + 8);
            ctx.lineTo(cx + 5, cy + 8);
            ctx.stroke();

            // Animated Talking Mouth
            ctx.strokeStyle = '#66fcf1';
            ctx.beginPath();
            if (isTalking) {
                mouthOpen = Math.abs(Math.sin(Date.now() / 100)) * 14 + 2;
            } else {
                mouthOpen = 2;
            }
            ctx.ellipse(cx, cy + 28, 15, mouthOpen, 0, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(drawHologram);
        }
        drawHologram();

        // --- Speech Synthesis (Text to Speech) ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.onstart = () => { isTalking = true; };
                utterance.onend = () => { isTalking = false; };
                utterance.onerror = () => { isTalking = false; };
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Speech Recognition (Speech to Speech Input) ---
        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.onstart = () => { document.getElementById('promptInput').placeholder = "Listening..."; };
            recognition.onresult = (event) => {
                document.getElementById('promptInput').value = event.results[0][0].transcript;
                runEngine();
            };
            recognition.start();
        }

        // --- Drawing Canvas Logic ---
        const paintCanvas = document.getElementById('paintCanvas');
        const pCtx = paintCanvas.getContext('2d');
        let painting = false;

        function toggleDrawing() {
            const area = document.getElementById('drawingArea');
            area.style.display = area.style.display === 'block' ? 'none' : 'block';
        }
        function startDraw(e) { painting = true; draw(e); }
        function endDraw() { painting = false; pCtx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            const rect = paintCanvas.getBoundingClientRect();
            pCtx.lineWidth = 3;
            pCtx.lineCap = 'round';
            pCtx.strokeStyle = '#000';
            pCtx.lineTo((e.touches ? e.touches[0].clientX : e.clientX) - rect.left, (e.touches ? e.touches[0].clientY : e.clientY) - rect.top);
            pCtx.stroke();
            pCtx.beginPath();
            pCtx.lineTo((e.touches ? e.touches[0].clientX : e.clientX) - rect.left, (e.touches ? e.touches[0].clientY : e.clientY) - rect.top);
        }
        paintCanvas.addEventListener('mousedown', startDraw);
        paintCanvas.addEventListener('mouseup', endDraw);
        paintCanvas.addEventListener('mousemove', draw);
        paintCanvas.addEventListener('touchstart', startDraw);
        paintCanvas.addEventListener('touchend', endDraw);
        paintCanvas.addEventListener('touchmove', draw);

        function clearCanvas() { pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height); }
        function sendDrawing() {
            document.getElementById('featureSelect').value = "Drawing Canvas AI";
            document.getElementById('promptInput').value = "A futuristic digital sketch based on my user drawing";
            runEngine();
        }

        // --- Main Execution Request Engine ---
        async function runEngine() {
            const category = document.getElementById('categorySelect').value;
            const feature = document.getElementById('featureSelect').value;
            const prompt = document.getElementById('promptInput').value;
            const outputBox = document.getElementById('outputBox');

            outputBox.innerText = "Processing request...";
            isTalking = true;

            try {
                const res = await fetch('/api/nano-vector', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, feature, prompt })
                });
                const data = await res.json();
                
                if (data.isImage) {
                    outputBox.innerHTML = `<img src="${data.result}" style="width:100%; border-radius:8px;">`;
                    isTalking = false;
                } else if (data.success) {
                    outputBox.innerText = data.result;
                    speakText(data.result);
                } else {
                    outputBox.innerText = "Error: " + data.error;
                    isTalking = false;
                }
            } catch (err) {
                outputBox.innerText = "Connection Error: " + err.message;
                isTalking = false;
            }
        }
    </script>
</body>
</html>
