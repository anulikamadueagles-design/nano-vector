<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Vector AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { height: 100%; width: 100%; background-color: #ffffff; color: #0d0d0d; overflow: hidden; display: flex; flex-direction: column; }

        /* Top Header Navigation (ChatGPT Style) */
        .top-nav { height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #f0f0f0; z-index: 10; }
        .nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; background: #fff; display: flex; align-items: center; justify-content: center; color: #0d0d0d; cursor: pointer; }
        .plus-pill { background: #e8f0fe; color: #1a73e8; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: none; }

        /* Main Content Workspace */
        .main-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 16px; }
        
        /* Interactive 3D Hologram Area */
        .hologram-container { width: 100%; height: 180px; background: #050b14; border-radius: 16px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #00f0ff; margin-bottom: 16px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
        canvas#holoCanvas { width: 100%; height: 100%; display: block; }

        /* Suggestion Action Chips (Matched ChatGPT Mobile Screenshot) */
        .chip-list { display: flex; flex-direction: column; gap: 12px; margin-top: auto; margin-bottom: 12px; }
        .chip-item { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #202124; padding: 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .chip-item:active { background: #f1f3f4; }
        .chip-icon { font-size: 18px; color: #444746; width: 24px; text-align: center; }

        /* Output Response Box */
        .chat-output { flex: 1; overflow-y: auto; font-size: 15px; line-height: 1.6; color: #1f1f1f; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .chat-card { padding: 12px 16px; border-radius: 16px; background: #f8f9fa; border: 1px solid #e9ecef; white-space: pre-wrap; word-break: break-word; }
        .media-result { width: 100%; max-height: 280px; border-radius: 12px; border: 1px solid #e5e5e5; object-fit: cover; margin-top: 8px; }

        /* Interactive Drawing Pad */
        #drawingModal { display: none; background: #f8f9fa; border: 1px solid #00f0ff; border-radius: 12px; padding: 10px; margin-bottom: 12px; text-align: center; }
        #paintCanvas { background: #fff; border: 1px solid #ccc; border-radius: 8px; cursor: crosshair; touch-action: none; }

        /* ChatGPT Input Bar Style */
        .input-bar-container { padding: 12px 16px 20px 16px; background: #ffffff; border-top: 1px solid #f0f0f0; }
        .input-pill { background: #f4f4f4; border-radius: 28px; display: flex; align-items: center; padding: 4px 8px 4px 14px; gap: 8px; border: 1px solid #e5e5e5; }
        .input-pill input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: #0d0d0d; }
        .action-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #444746; font-size: 16px; cursor: pointer; }
        .wave-btn { background: #1a73e8; color: #ffffff; }

        /* Creator Tag Footer */
        .creator-info { text-align: center; font-size: 10px; color: #80868b; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="top-nav">
        <button class="nav-btn" onclick="toggleDrawing()"><i class="fa-solid fa-bars"></i></button>
        <button class="plus-pill"><i class="fa-solid fa-sparkles"></i> Get Plus</button>
        <button class="nav-btn" onclick="clearChat()"><i class="fa-solid fa-pen-to-square"></i></button>
    </div>

    <!-- Main Body Area -->
    <div class="main-container">
        
        <!-- Animated High-Tech Cyber Hologram -->
        <div class="hologram-container">
            <canvas id="holoCanvas"></canvas>
        </div>

        <!-- Chat Output Messages Area -->
        <div class="chat-output" id="chatOutput">
            <div class="chat-card">Hello! I am Nano Vector AI Engine, created by David Kamsi Elvis by Vectors Element Tech. How can I help you today?</div>
        </div>

        <!-- Canvas Drawing Feature Module -->
        <div id="drawingModal">
            <canvas id="paintCanvas" width="300" height="150"></canvas>
            <div style="margin-top:8px; display:flex; justify-content:center; gap:8px;">
                <button onclick="clearCanvas()" style="padding:6px 12px; border-radius:6px; border:1px solid #ccc; background:#fff;">Clear</button>
                <button onclick="sendDrawing()" style="padding:6px 12px; border-radius:6px; background:#1a73e8; color:#fff; border:none;">Analyze Canvas</button>
            </div>
        </div>

        <!-- Quick Action Chips (Matches screenshot) -->
        <div class="chip-list" id="chipList">
            <div class="chip-item" onclick="startVoiceChat()">
                <div class="chip-icon"><i class="fa-solid fa-headphones"></i></div>
                <div>Start a voice chat</div>
            </div>
            <div class="chip-item" onclick="triggerImageGen()">
                <div class="chip-icon"><i class="fa-solid fa-image"></i></div>
                <div>Create an image or sticker</div>
            </div>
            <div class="chip-item" onclick="triggerWrite()">
                <div class="chip-icon"><i class="fa-solid fa-pen-nib"></i></div>
                <div>Write or edit</div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar (ChatGPT Input Pill Style) -->
    <div class="input-bar-container">
        <div class="input-pill">
            <button class="action-icon" onclick="toggleDrawing()"><i class="fa-solid fa-plus"></i></button>
            <input type="text" id="userInput" placeholder="Ask ChatGPT" onkeypress="handleKeyPress(event)">
            <button class="action-icon" onclick="startSpeech()"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-icon wave-btn" onclick="sendPrompt('text')"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
        <div class="creator-info">Nano Vector AI • Created by David Kamsi Elvis by Vectors Element Tech</div>
    </div>

    <script>
        // --- High-Tech Animated Hologram Visual Engine ---
        const canvas = document.getElementById('holoCanvas');
        const ctx = canvas.getContext('2d');
        let isSpeaking = false;

        function resizeHolo() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeHolo);
        resizeHolo();

        function renderHologram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Matrix Particle Field Background
            for(let i=0; i<15; i++) {
                ctx.fillStyle = `rgba(0, 240, 255, ${Math.random() * 0.4})`;
                ctx.fillRect(cx + (Math.random() - 0.5) * 200, cy + (Math.random() - 0.5) * 120, 2, 2);
            }

            // Holographic Head Ring
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy - 10, 50, 0, Math.PI * 2);
            ctx.stroke();

            // Holographic Eyes
            const eyeY = cy - 20 + Math.sin(Date.now() / 250) * 2;
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(cx - 18, eyeY, 5, 0, Math.PI * 2);
            ctx.arc(cx + 18, eyeY, 5, 0, Math.PI * 2);
            ctx.fill();

            // Holographic Nose
            ctx.strokeStyle = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(cx, cy - 10);
            ctx.lineTo(cx - 4, cy + 5);
            ctx.lineTo(cx + 4, cy + 5);
            ctx.stroke();

            // Reactive Speaking Mouth
            ctx.beginPath();
            let mouthHeight = isSpeaking ? (Math.abs(Math.sin(Date.now() / 90)) * 12 + 3) : 2;
            ctx.ellipse(cx, cy + 22, 14, mouthHeight, 0, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(renderHologram);
        }
        renderHologram();

        // --- Speech Engine (TTS & Speech-to-Text) ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.onstart = () => { isSpeaking = true; };
                utter.onend = () => { isSpeaking = false; };
                utter.onerror = () => { isSpeaking = false; };
                window.speechSynthesis.speak(utter);
            }
        }

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Voice input not supported on this browser.");
            const rec = new SpeechRecognition();
            rec.onstart = () => { document.getElementById('userInput').placeholder = "Listening..."; };
            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendPrompt('text');
            };
            rec.start();
        }

        // --- Drawing Canvas Controls ---
        const paint = document.getElementById('paintCanvas');
        const pCtx = paint.getContext('2d');
        let drawing = false;

        function toggleDrawing() {
            const m = document.getElementById('drawingModal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }
        function clearCanvas() { pCtx.clearRect(0, 0, paint.width, paint.height); }
        function sendDrawing() {
            document.getElementById('userInput').value = "Analyze and enhance this digital canvas artwork";
            toggleDrawing();
            sendPrompt('drawing');
        }
        paint.addEventListener('mousedown', () => drawing = true);
        paint.addEventListener('mouseup', () => { drawing = false; pCtx.beginPath(); });
        paint.addEventListener('mousemove', (e) => {
            if(!drawing) return;
            const r = paint.getBoundingClientRect();
            pCtx.lineWidth = 2;
            pCtx.lineTo(e.clientX - r.left, e.clientY - r.top);
            pCtx.stroke();
        });

        // --- Action Chip Functions ---
        function startVoiceChat() { startSpeech(); }
        function triggerImageGen() {
            document.getElementById('userInput').value = "Create a high resolution futuristic sticker of Nano Vector AI";
            sendPrompt('image');
        }
        function triggerWrite() {
            document.getElementById('userInput').value = "Write a comprehensive summary about AI technology created by Vectors Element Tech";
            sendPrompt('text');
        }
        function clearChat() {
            document.getElementById('chatOutput').innerHTML = '<div class="chat-card">New chat session started. Ask Nano Vector anything!</div>';
        }
        function handleKeyPress(e) { if (e.key === 'Enter') sendPrompt('text'); }

        // --- Main Request Handler ---
        async function sendPrompt(mode = 'text') {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const chatOutput = document.getElementById('chatOutput');
            document.getElementById('chipList').style.display = 'none';

            // User Message Card
            const userCard = document.createElement('div');
            userCard.className = 'chat-card';
            userCard.style.background = '#e8f0fe';
            userCard.innerText = prompt;
            chatOutput.appendChild(userCard);

            input.value = '';
            isSpeaking = true;

            // AI Processing Indicator
            const aiCard = document.createElement('div');
            aiCard.className = 'chat-card';
            aiCard.innerText = "Nano Vector is thinking...";
            chatOutput.appendChild(aiCard);
            chatOutput.scrollTop = chatOutput.scrollHeight;

            try {
                const res = await fetch('/api/nano-vector', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode, prompt })
                });
                const data = await res.json();

                if (data.isImage) {
                    aiCard.innerHTML = `<p>Generated Image Result:</p><img src="${data.result}" class="media-result">`;
                    isSpeaking = false;
                } else if (data.success) {
                    aiCard.innerText = data.result;
                    speak(data.result);
                } else {
                    aiCard.innerText = "Error: " + data.error;
                    isSpeaking = false;
                }
            } catch (err) {
                aiCard.innerText = "Connection Error: " + err.message;
                isSpeaking = false;
            }
            chatOutput.scrollTop = chatOutput.scrollHeight;
        }
    </script>
</body>
</html>
